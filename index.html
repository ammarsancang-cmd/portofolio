<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & Karya - Ammar Tubagus Sancang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Portofolio & Karya</h1>
            <div class="flex items-center space-x-3">
                <button onclick="location.reload()" class="p-2 hover:bg-blue-700 rounded-full transition" title="Refresh">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Filter & Search Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="w-full md:w-1/3 flex items-center space-x-3">
                <label for="filterKategori" class="text-sm font-medium text-gray-600 whitespace-nowrap">Filter Kategori:</label>
                <select id="filterKategori" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="semua">Semua</option>
                    <option value="mobile">Mobile App</option>
                    <option value="web">Web Development</option>
                </select>
            </div>
            <div class="w-full md:w-1/3 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </span>
                <input type="text" id="searchInput" placeholder="Cari karya atau teknologi..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Tags / Chips -->
        <div class="flex flex-wrap gap-2 mb-6" id="tagContainer">
            <button class="px-4 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-full shadow-sm">Semua</button>
            <button class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-full transition">Mobile App</button>
            <button class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-full transition">Web Development</button>
            <button class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-full transition">UI/UX Design</button>
            <button class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-full transition">Graphic Design</button>
        </div>

        <!-- List Proyek -->
        <div class="space-y-4" id="projectList">
            
            <!-- Proyek: JosLearn SMAN 1 Rejoso (Foto Otomatis Langsung Tampil) -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:shadow-md transition">
                <div class="flex items-center space-x-4">
                    <!-- Foto Profil Otomatis -->
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Ammar Tubagus Sancang" id="profileImage" class="w-16 h-16 rounded-xl object-cover shadow-sm border border-gray-100">
                    <div>
                        <h3 class="text-lg font-bold text-gray-900">JosLearn SMAN 1 Rejoso</h3>
                        <p class="text-sm text-gray-600 mt-0.5">Sistem Manajemen Pembelajaran & Absensi Digital Kedisiplinan Sekolah</p>
                        <div class="flex flex-wrap items-center gap-2 mt-2">
                            <span class="px-2.5 py-0.5 bg-blue-100 text-blue-800 text-xs font-semibold rounded-md">Web Development</span>
                            <span class="text-xs text-gray-500 font-medium">Tech: Flutter, Laravel, MySQL</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2 self-end md:self-center">
                    <span class="text-xs bg-emerald-100 text-emerald-800 font-medium px-3 py-1 rounded-full">Aktif / Publik</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-4 text-center text-xs text-gray-500">
        &copy; 2026 Ammar Tubagus Sancang. Portofolio Profesional.
    </footer>

</body>
</html>
